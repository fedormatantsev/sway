[package]
name = "sway-base-nodes"
version.workspace = true
edition.workspace = true

# The base value/signal nodes: every one is a pure function of its inlets and
# state, so this crate reads nothing outside the graph and needs no clock.
[dependencies]
sway-graph.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_math.workspace = true
bevy_reflect.workspace = true

[dev-dependencies]
# The tick harness, rather than a copy of it in this crate.
sway-graph = { workspace = true, features = ["test-support"] }
