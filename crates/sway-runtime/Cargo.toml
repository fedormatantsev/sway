[package]
name = "sway-runtime"
edition.workspace = true
version.workspace = true

[dependencies]
bevy.workspace = true
bytemuck.workspace = true
sway-gpu.workspace = true
sway-graph.workspace = true
sway-viewport-input.workspace = true
sway-selection.workspace = true
# `ViewportInputRx`: the editor's viewport channel is drained here, and the
# boundary that drains a channel owns its plumbing.
crossbeam-channel.workspace = true
# The sprite material is a node as well as a pipeline: it needs its own shader
# (this crate owns those) *and* `FloatOut`/`Vec3Out` for its inlets. Mirrors
# `sway-midi`, which depends on `sway-nodes` for exactly the same reason.
# Acyclic — `sway-nodes` has no runtime dependency (design D6).
sway-nodes.workspace = true

[dev-dependencies]
naga.workspace = true
crossbeam-channel.workspace = true
