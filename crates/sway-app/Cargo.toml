[package]
name = "sway-app"
edition.workspace = true
version.workspace = true

[[bin]]
name = "sway"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["file_watcher"] }
crossbeam-channel.workspace = true
sway-graph.workspace = true
sway-events.workspace = true
sway-viewport-input.workspace = true
sway-selection.workspace = true
sway-document.workspace = true
sway-midi.workspace = true
sway-base-nodes.workspace = true
sway-runtime.workspace = true
sway-editor-viewport.workspace = true
sway-gpu.workspace = true
sway-editor.workspace = true
winit.workspace = true
kurbo.workspace = true
masonry_core.workspace = true
rfd = "0.15"
# Encoding is a host concern: `sway-gpu` reads a target back as raw pixels and
# knows nothing about file formats or filesystems (design D7). PNG only —
# nothing here writes another format, and the default feature set pulls in a
# dozen decoders no capture will ever use.
image = { version = "0.25", default-features = false, features = ["png"] }
