[workspace]
resolver = "3"
members = ["crates/sway-midi", "crates/sway-app", "crates/sway-runtime"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
bevy = "=0.19.0"
crossbeam-channel = "0.5"
sway-midi = { path = "crates/sway-midi" }
sway-runtime = { path = "crates/sway-runtime" }
bytemuck = { version = "1", features = ["derive"] }
naga = { version = "29", features = ["wgsl-in"] }
